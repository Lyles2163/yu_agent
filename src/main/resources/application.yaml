spring:
  application:
    name: yu-agent
  profiles:
    active: dev


server:
  port: 8123
  servlet:
   context-path: /api

# springdoc-openapi配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: org.yupi.yuagent.controller
# knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn